name: property-rescue-app
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: property_rescue
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/prepare_app.py first}
      POSTGRES_DB: property_rescue
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_rescue -d property_rescue"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  app_pgdata:
